on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: CI

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    - run: cargo build --verbose
    - run: cargo test --verbose
