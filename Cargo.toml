[package]
name = "systemd-network-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.72", default-features = false, features = ["std"] }
clap = { version = "4.3.19", default-features = false, features = ["derive", "std", "help", "usage"] }
reqwest = { version = "0.13.4", features = ["native-tls"], default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt", "time"] }
tokio-stream = { version = "0.1.14", default-features = false }
zbus = { version = "5.16.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = "yes"
panic = "abort"
opt-level = 3
codegen-units = 1
incremental = false
